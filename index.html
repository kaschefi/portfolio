<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <link rel="preload" as="image" href="/me.webp" type="image/webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/robotme.webp" type="image/webp" fetchpriority="high" />
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="/antigravity_icon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M.Kashefirad - Portfolio</title>
  <style>
    :root {
      --bg-color: #0d1117;
      /* match your site's dark/light background */
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: #c9d1d9;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* Optional simple CSS pulse loader before React takes over */
    #initial-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <meta name="description"
    content="Interactive 3D Bookshelf Portfolio showcasing seven volumes of engineering, autonomous systems, robotics, web and mobile architectures." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />

    rel="stylesheet" />
